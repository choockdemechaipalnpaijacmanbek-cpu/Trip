<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกงบประมาณและค่าใช้จ่าย (Cloud Sync)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 pb-12">
    <div class="max-w-md mx-auto p-4 sm:p-6">
        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-600 rounded-3xl p-6 text-white shadow-lg mb-6">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <h1 class="text-xl font-bold">บันทึกงบประมาณและค่าใช้จ่าย</h1>
                    <p class="text-xs text-blue-100 mt-1" id="trip-id-display">กำลังเชื่อมต่อคลาวด์...</p>
                </div>
                <span id="sync-status" class="bg-blue-500/50 text-xs px-2.5 py-1 rounded-full font-medium flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> ซิงค์แล้ว
                </span>
            </div>

            <!-- Summary Cards -->
            <div class="grid grid-cols-3 gap-2 mt-4 pt-4 border-t border-blue-500/30 text-center">
                <div>
                    <p class="text-[11px] text-blue-100">งบประมาณรวม</p>
                    <p id="total-budget" class="text-base font-bold mt-0.5">0.00</p>
                </div>
                <div>
                    <p class="text-[11px] text-blue-100">ใช้จ่ายรวม</p>
                    <p id="total-expense" class="text-base font-bold mt-0.5 text-rose-200">0.00</p>
                </div>
                <div>
                    <p class="text-[11px] text-blue-100">คงเหลือ</p>
                    <p id="total-balance" class="text-base font-bold mt-0.5 text-emerald-200">0.00</p>
                </div>
            </div>
        </div>

        <!-- Share Link Button -->
        <div class="mb-6">
            <button onclick="shareTrip()" class="w-full bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-medium py-2.5 px-4 rounded-2xl shadow-sm text-sm transition flex items-center justify-center gap-2">
                🔗 คัดลอกลิงก์ทริปนี้ไปเปิดในมือถือเครื่องอื่น
            </button>
        </div>

        <!-- Add Transaction Form -->
        <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 mb-6">
            <h2 class="text-sm font-bold text-slate-700 mb-3">เพิ่มรายการ (งบหรือค่าใช้จ่าย)</h2>
            <form id="transaction-form" onsubmit="addTransaction(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">ประเภทรายการ</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button type="button" id="btn-type-budget" onclick="setEntryType('budget')" class="py-2 text-xs font-semibold rounded-xl border border-emerald-500 bg-emerald-50 text-emerald-700 transition">เงินงบประมาณเข้า</button>
                        <button type="button" id="btn-type-expense" onclick="setEntryType('expense')" class="py-2 text-xs font-semibold rounded-xl border border-slate-200 text-slate-600 transition">รายจ่ายออก</button>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">ชื่อรายการ</label>
                    <input type="text" id="desc-input" required placeholder="เช่น งบตั้งต้น หรือ ค่าอาหาร" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">จำนวนเงิน (บาท)</label>
                    <input type="number" step="any" id="amount-input" required placeholder="0.00" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button type
